# main への PR は、この repo の develop からのものだけを許す。
#
# pull_request_target を使う理由: PR の head ではなく、既定ブランチの定義で動くため、
#   PR 側から検査そのものを書き換えられない (base ブランチの定義ではない。GitHub の docs と、
#   2025-12-08 から有効の changelog による。ADR 0002)。既定ブランチに入って初めて有効になる。
# checkout しない理由: pull_request_target は、既定では書き込み権限と secrets のある文脈で動く。
#   ここでは permissions を空にし、そのうえで PR のコードを取得せず、
#   信頼できないコードを持ち込まない。
# head の情報を env 経由で渡す理由: ブランチ名は PR の作成者が決める。
#   run に直接展開すると、ブランチ名でシェルにコマンドを注入されうる。
name: main-source-guard

on:
  pull_request_target:
    branches: [main]
    # edited: PR の base が後から main に変更された場合も検査するため。docs は edited に base の変更を
    # 含めるが、この workflow が実際に起動することは実機で未検証 (ADR 0002)。
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  # job 名 only-from-develop は、required check 名として固定する。変えると保守者の設定と食い違う。
  # 他の workflow の job と重複させない (重複すると check の結果が曖昧になる。GitHub の docs)。
  only-from-develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: head が同一 repo の develop であることを確認する
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" = "$THIS_REPO" ] && [ "$HEAD_REF" = "develop" ]; then
            echo "OK: develop からの PR です。"
            exit 0
          fi
          echo "エラー: main への PR は、この repo の develop からのものだけを許します (head: ${HEAD_REPO}:${HEAD_REF})。" >&2
          exit 1
